version: 2
project_name: iphonectl-pp-cli
changelog:
  disable: true
builds:
  - id: iphonectl-pp-cli
    main: ./cmd/iphonectl-pp-cli
    binary: iphonectl-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X iphonectl-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: iphonectl-pp-mcp
    main: ./cmd/iphonectl-pp-mcp
    binary: iphonectl-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: iphonectl-pp-cli
    repository:
      owner: barkleesanders
      name: homebrew-tap
    homepage: "https://github.com/barkleesanders/iphonectl-pp-cli"
    description: "REST control surface for an iOS device via WebDriverAgent (WDA)"
    install: |
      bin.install "iphonectl-pp-cli"
      bin.install "iphonectl-pp-mcp"
